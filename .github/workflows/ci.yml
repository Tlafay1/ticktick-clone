# CI : garde-fou principal du dépôt — backend (pytest + ruff) et web (typecheck + vitest + build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticktick
          POSTGRES_USER: ticktick
          POSTGRES_PASSWORD: ticktick
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ticktick"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ticktick
      POSTGRES_PASSWORD: ticktick
      POSTGRES_DB: ticktick
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Installer les dépendances (lockfile gelé)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tests backend (pytest)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Typecheck (vue-tsc)
        run: npx vue-tsc -b
      - name: Tests web (vitest)
        run: npx vitest run
      - name: Build (vite)
        run: npx vite build

  # Le paquet desktop n'a pas de typecheck ni de build vérifiable ici : ses
  # tests portent sur les invariants qui ne cassent qu'à l'installation
  # (dépendances CommonJS, script NSIS, contenu du paquet).
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # les tests ne lancent pas Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tests desktop (vitest)
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticktick
          POSTGRES_USER: ticktick
          POSTGRES_PASSWORD: ticktick
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ticktick"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ticktick
      POSTGRES_PASSWORD: ticktick
      POSTGRES_DB: ticktick
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dépendances backend
        working-directory: backend
        run: uv sync --frozen
      - name: Migrer + démarrer le backend sur :8001
        working-directory: backend
        run: |
          uv run python manage.py migrate
          nohup uv run python manage.py runserver 8001 > /tmp/django.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8001/health/ && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dépendances web
        working-directory: web
        run: npm ci
      - name: Navigateurs Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Release continue : chaque push sur main qui touche un client (web, desktop,
  # mobile) publie une version patch, et desktop comme Android se mettent à jour
  # seuls. Un tag poussé avec GITHUB_TOKEN ne déclenche aucun workflow : on
  # appelle donc release.yml directement.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, desktop, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag de la version suivante (si un client a changé)
        id: next
        run: |
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- web desktop mobile; then
            echo "Aucun client modifié depuis $LAST : pas de release."
            exit 0
          fi
          IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
          PAT=$(( ${PAT:-0} + 1 ))
          # versionCode Android = MAJ*10000 + MIN*100 + PAT : le patch ne doit
          # jamais atteindre 100 (0.2.100 collisionnerait avec 0.3.0).
          if [ "$PAT" -ge 100 ]; then MIN=$(( ${MIN:-0} + 1 )); PAT=0; fi
          TAG="v${MAJ:-0}.${MIN:-0}.${PAT}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
